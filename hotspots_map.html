            margin-right: 8px;

        .cluster-label {
            font-weight: 600;
            color: #e2e8f0;
            flex-grow: 1;
        }
        .cluster-count {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 700;

            margin-bottom: 8px;
        }

            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .popup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(30, 41, 59, 0.5);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .popup-stat-label {
            font-size: 9px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
        }
        .popup-stat-val {
            font-size: 14px;
            font-weight: 800;
            color: #38bdf8;

            maxZoom: 19
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri World Imagery',
            maxZoom: 18
        });

        L.control.layers({
            "🌙 Dark Matter": darkMatter,
            "☀️ Positron Light": positronLight,
            "🛰️ Satellite Imagery": satellite
        }, null, { position: 'topleft' }).addTo(map);

        // Marker Management
        let markers = [];
        let activeClusters = new Set([0, 1, 2, 3, 4, 5]);

        function renderMarkers() {
            // Clear existing
            markers.forEach(m => map.removeLayer(m.layer));
            markers = [];

            zoneData.forEach(z => {
                if (!activeClusters.has(z.cluster_id)) return;

                const cMeta = clusterMeta[z.cluster_id] || { name: "Cluster", color: "#38bdf8", bg: "rgba(56, 189, 248, 0.2)" };
                
                // Radius proportional to log/sqrt of trips
                const radius = Math.max(7, Math.min(22, Math.sqrt(z.trips_num) * 0.1));

                const marker = L.circleMarker([z.lat, z.lon], {
                    radius: radius,
                    color: cMeta.color,
                    weight: 2,
                    fillColor: cMeta.color,
                    fillOpacity: 0.65,
                    riseOnHover: true
                });

                // Tooltip on Hover
                marker.bindTooltip(`<b>${z.name}</b> (${z.boro})<br><span style="color:#38bdf8;">${z.trips} Trips</span>`, {
                    direction: 'top',
                    offset: [0, -radius]
                });

                // Rich Popup on Click
                const popupHtml = `
                    <div class="popup-card">
                        <div class="popup-name">${z.name}</div>
                        <div class="popup-sub">Borough: <b>${z.boro}</b></div>
                        <span class="popup-badge" style="background:${cMeta.bg}; color:${cMeta.color};">
                            ${cMeta.name}
                        </span>
                        <div class="popup-grid">
                            <div>
                                <div class="popup-stat-label">ANNUAL PICKUPS</div>
                                <div class="popup-stat-val">${z.trips}</div>
                            </div>
                            <div>
                                <div class="popup-stat-label">AVG BASE FARE</div>
                                <div class="popup-stat-val" style="color:#4ade80;">${z.fare}</div>
                            </div>
                            <div>
                                <div class="popup-stat-label">NIGHTLIFE RATIO</div>
                                <div class="popup-stat-val" style="color:#c084fc;">${z.night}</div>
                            </div>
                            <div>
                                <div class="popup-stat-label">DISPATCH PRIORITY</div>
                                <div class="popup-stat-val" style="color:#fbbf24;">${z.trips_num > 15000 ? 'Tier 1' : 'Tier 2'}</div>
                            </div>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml, { maxWidth: 280 });
                marker.addTo(map);

                markers.push({ data: z, layer: marker });
            });

            document.getElementById('zoneCountText').innerText = `Showing ${markers.length} Active Mobility Corridors`;
        }

        // Render Cluster Filters
        function initFilters() {
            const container = document.getElementById('clusterFilters');
            container.innerHTML = '';

            const clusterCounts = {};
            zoneData.forEach(z => {
                clusterCounts[z.cluster_id] = (clusterCounts[z.cluster_id] || 0) + 1;
            });

            [2, 1, 3, 0, 4, 5].forEach(cid => {
                const meta = clusterMeta[cid];
                if (!meta) return;
                const count = clusterCounts[cid] || 0;

                const item = document.createElement('div');
                item.className = 'cluster-item active';
                item.id = `cfilter-${cid}`;
                item.innerHTML = `
                    <span class="cluster-dot" style="background: ${meta.color};"></span>
                    <span class="cluster-label">${meta.name.split(' ')[0]} ${meta.name.split(' ')[1] || ''}</span>
                    <span class="cluster-count">${count}</span>
                `;

                item.onclick = () => {
                    if (activeClusters.has(cid)) {
                        activeClusters.delete(cid);
                        item.classList.remove('active');
                        item.style.opacity = '0.4';
                    } else {
                        activeClusters.add(cid);
                        item.classList.add('active');
                        item.style.opacity = '1';
                    }
                    renderMarkers();
                };

                container.appendChild(item);
            });
        }

        // Search Filter
        function filterZonesSearch() {
            const term = document.getElementById('zoneSearch').value.toLowerCase().trim();
            if (!term) return;

            const match = markers.find(m => m.data.name.toLowerCase().includes(term));
            if (match) {
                map.flyTo([match.data.lat, match.data.lon], 14, { duration: 1.2 });
                match.layer.openPopup();
            }
        }

        initFilters();
        renderMarkers();
    </script>
</body>
</html>
